<style>
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
    font-family:Arial, sans-serif;
    display:flex;
    height:100vh;
    overflow:hidden;
    background:#f4f6f8;
    color:#222;
}
/* ---------- Sidebar ---------- */
#sidebar{
    width:340px;
    min-width:340px;
    background:#1f4e79;
    color:#eef3f8;
    display:flex;
    flex-direction:column;
    height:100%;
}
#sidebar .brand{padding:18px 18px 12px;border-bottom:1px solid rgba(255,255,255,.15);}
#sidebar .brand h1{font-size:18px;margin:0 0 2px;color:#fff;}
#sidebar .brand .sub{font-size:12px;color:#bcd4ea;}
#filterWrap{padding:12px 14px;}
#filter{width:100%;padding:8px 10px;border:none;border-radius:6px;font-size:13px;}
#nav{flex:1;overflow-y:auto;padding:4px 8px 24px;}
#nav::-webkit-scrollbar{width:9px;}
#nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);border-radius:6px;}
.group-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#9fc0de;padding:14px 10px 6px;font-weight:bold;}
.track-label{font-size:13px;letter-spacing:.06em;text-transform:uppercase;font-weight:800;color:#fff;background:rgba(255,255,255,.10);border-left:4px solid #c0392b;padding:12px 10px;margin:16px 4px 2px;border-radius:5px;}
.track-label:first-child{margin-top:2px;}
.chapter{margin:1px 0;}
.chapter-row{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:14px;color:#eef3f8;user-select:none;}
.chapter-row:hover{background:rgba(255,255,255,.10);}
.chapter-row.active{background:#c0392b;color:#fff;font-weight:bold;}
.chapter-row .arrow{width:14px;font-size:10px;transition:transform .15s ease;flex:0 0 auto;opacity:.8;}
.chapter.open .arrow{transform:rotate(90deg);}
.chapter-row .num{font-size:11px;background:rgba(255,255,255,.18);border-radius:4px;padding:1px 5px;flex:0 0 auto;}
.chapter-row.active .num{background:rgba(255,255,255,.30);}
.chapter-row .title{flex:1;}
.chapter-row .read-time{flex:0 0 auto;font-size:10.5px;font-weight:normal;color:rgba(255,255,255,.55);white-space:nowrap;}
.chapter-row.active .read-time{color:rgba(255,255,255,.8);}
.sections{display:none;margin:2px 0 6px 8px;border-left:2px solid rgba(255,255,255,.18);padding-left:6px;}
.chapter.open .sections{display:block;}
.sec-link{display:flex;align-items:flex-start;gap:8px;padding:6px 10px;margin-bottom:2px;font-size:12.5px;color:#cfe0f0;text-decoration:none;border-radius:5px;line-height:1.4;cursor:pointer;}
.sec-link .sec-num{flex:0 0 auto;min-width:17px;height:17px;margin-top:1px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:10px;font-weight:bold;display:flex;align-items:center;justify-content:center;}
.sec-link .sec-title{flex:1;}
.sec-link.sec-highlight .sec-title{color:#fff;font-weight:bold;}
.sec-link:hover{background:rgba(255,255,255,.10);color:#fff;}
.sec-link.active{background:rgba(255,255,255,.16);color:#fff;font-weight:bold;}
.sec-link.active .sec-num{background:rgba(255,255,255,.32);}
.sec-link.sec-divider{margin-top:8px;padding-top:8px;padding-bottom:6px;border-top:1px solid rgba(224,102,80,.4);text-transform:uppercase;letter-spacing:.06em;font-size:10.5px;font-weight:800;color:#e0664f;}
.sec-link.sec-divider:hover{color:#ff8f78;}
.no-sec{font-size:12px;color:#9fc0de;padding:4px 10px 8px;font-style:italic;}
/* ---------- Main ---------- */
#main{flex:1;display:flex;flex-direction:column;height:100%;min-width:0;}
#topbar{height:48px;background:#fff;border-bottom:1px solid #dfe5ea;display:flex;align-items:center;gap:10px;padding:0 14px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
#hamburger{display:none;border:none;background:#1f4e79;color:#fff;width:34px;height:34px;border-radius:6px;cursor:pointer;font-size:16px;}
#topTitle{font-weight:bold;color:#1f4e79;font-size:15px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#topbar button.nav{border:1px solid #cdd6de;background:#f4f6f8;color:#1f4e79;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px;}
#topbar button.nav:hover{background:#e7edf3;}
#topbar button.nav:disabled{opacity:.4;cursor:default;}
#content{flex:1;overflow:auto;background:#f4f6f8;padding:18px 26px 60px;line-height:1.7;-webkit-overflow-scrolling:touch;}
.chapter-content{display:none;}
.chapter-content.active{display:block;}
/* chapter content is fetched on demand -- this covers the gap while it loads */
#loadingIndicator{display:none;padding:60px 20px;text-align:center;color:#7d8794;font-size:14px;}
#loadingIndicator.show{display:block;}
.load-error{padding:24px 20px;color:#c0392b;}
.load-error a{color:#1f4e79;text-decoration:underline;cursor:pointer;}
/* chapter content styling (scoped) */
#content h1,#content h2,#content h3,#content h4{color:#1f4e79;}
#content .section{background:white;padding:20px;margin-bottom:20px;border-radius:8px;box-shadow:0 2px 4px rgba(0,0,0,.1);}
#content .question{color:#c0392b;font-weight:bold;font-size:20px;}
#content .answer{margin-top:10px;}
#content .roi{color:green;font-weight:bold;}
#content .followup{background:#fff8dc;padding:10px;border-left:4px solid orange;margin-top:10px;}
#content pre{background:#f4f4f4;padding:10px;border-radius:4px;overflow:auto;}
#content table{border-collapse:collapse;margin:10px 0;}
#content th,#content td{border:1px solid #ccc;padding:6px 10px;text-align:left;}
#content th{background:#1f4e79;color:white;}
#content hr{border:none;border-top:1px solid #d8dee4;margin:18px 0;}
/* ---------- Backdrop (mobile only) ---------- */
#backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25;}
/* ---------- Responsive ---------- */
@media (max-width:820px){
    #hamburger{display:block;}
    #sidebar{position:fixed;top:0;left:0;bottom:0;width:86vw;max-width:320px;min-width:0;transform:translateX(-100%);transition:transform .25s ease;z-index:30;box-shadow:2px 0 16px rgba(0,0,0,.4);}
    #sidebar.open{transform:none;}
    #backdrop.show{display:block;}
    #content{padding:14px 14px 60px;}
    #topTitle{font-size:14px;}
    #topbar button.nav{padding:6px 9px;font-size:12px;}
}
/* ---------- Theme toggle button ---------- */
#themeBtn{border:1px solid #cdd6de;background:#f4f6f8;color:#1f4e79;width:34px;height:34px;border-radius:6px;cursor:pointer;font-size:15px;line-height:1;flex:0 0 auto;}
#themeBtn:hover{background:#e7edf3;}
/* ---------- Dark mode ---------- */
body.dark{background:#15181c;color:#d8dde3;}
body.dark #sidebar{background:#11151b;color:#d8dde3;border-right:1px solid #262b33;}
body.dark #sidebar .brand{border-bottom:1px solid rgba(255,255,255,.08);}
body.dark #sidebar .brand h1{color:#eaeef3;}
body.dark #sidebar .brand .sub{color:#8aa6c2;}
body.dark .group-label{color:#7fa6cc;}
body.dark .chapter-row{color:#d8dde3;}
body.dark .chapter-row:hover{background:rgba(255,255,255,.07);}
body.dark .chapter-row.active{background:#c0392b;color:#fff;}
body.dark .sec-link{color:#aebfd2;}
body.dark .sec-link:hover{color:#fff;}
body.dark .sec-link.sec-divider{color:#e0664f;}
body.dark .sec-link.sec-divider:hover{color:#ff8f78;}
body.dark #filter{background:#1c2128;color:#e6e6e6;border:1px solid #2a2f36;}
body.dark #filter::placeholder{color:#7d8794;}
body.dark #topbar{background:#1a1d21;border-bottom:1px solid #2a2f36;box-shadow:0 1px 3px rgba(0,0,0,.4);}
body.dark #topTitle{color:#6ea8e0;}
body.dark #topbar button.nav{background:#22272e;border:1px solid #353b44;color:#9fc3e8;}
body.dark #topbar button.nav:hover{background:#2c333c;}
body.dark #themeBtn{background:#22272e;border:1px solid #353b44;color:#ffd66b;}
body.dark #themeBtn:hover{background:#2c333c;}
body.dark #content{background:#15181c;}
body.dark #content h1,body.dark #content h2,body.dark #content h3,body.dark #content h4{color:#6ea8e0;}
body.dark #content .section{background:#21262d;box-shadow:0 2px 4px rgba(0,0,0,.4);border:1px solid #2c333c;}
body.dark #content .question{color:#ff8a7a;}
body.dark #content .answer{color:#d8dde3;}
body.dark #content .roi{color:#5fd28a;}
body.dark #content .followup{background:#33301f;border-left:4px solid #e0922f;color:#ecd9b0;}
body.dark #content .followup h3{color:#f0c060;}
body.dark #content pre{background:#0d1117;color:#d8dde3;border:1px solid #2c333c;}
body.dark #content code{color:#e6b673;}
body.dark #content th{background:#27496e;color:#fff;border:1px solid #3a4048;}
body.dark #content td{border:1px solid #3a4048;color:#d8dde3;}
body.dark #content hr{border-top:1px solid #2a2f36;}
body.dark #content a{color:#6ea8e0;}
body.dark #loadingIndicator{color:#5a6674;}
body.dark .load-error{color:#ff8a7a;}
body.dark .load-error a{color:#6ea8e0;}
</style>
</head>

var nav = document.getElementById('nav');

// ---------- Theme (dark / light) ----------
function applyTheme(mode){
    var dark = (mode === 'dark');
    document.body.classList.toggle('dark', dark);
    themeBtn.textContent = dark ? '☀️' : '🌙';
    themeBtn.title = dark ? 'Switch to light mode' : 'Switch to dark mode';
}
function initTheme(){
    var saved = null;
    try{ saved = localStorage.getItem('handbook-theme'); }catch(e){}
    if(!saved){
        saved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    applyTheme(saved);
}
themeBtn.addEventListener('click', function(){
    var dark = !document.body.classList.contains('dark');
    applyTheme(dark ? 'dark' : 'light');
    try{ localStorage.setItem('handbook-theme', dark ? 'dark' : 'light'); }catch(e){}
});
initTheme();

function pushHash(hash, state){ try{ history.pushState(state||{}, '', hash); }catch(e){ if(location.hash!==hash) location.hash=hash; } }
function replaceHash(hash, state){ try{ history.replaceState(state||{}, '', hash); }catch(e){} }
// ch.num ("01".."93") is only unique WITHIN a track now that each track restarts its own
// numbering, so routing/DOM ids key off trackSlug+num instead -- ch.num itself stays clean
// for display (sidebar badge, top title).
function chKey(ch){ return ch.trackSlug + '-' + ch.num; }
function makeHash(idx, sec){ var ch=CHAPTERS[idx]; return '#'+chKey(ch)+(sec?('-'+sec):''); }
function parseHash(){
    var h = location.hash.replace(/^#/, ''); if(!h) return null;
    for(var i=0;i<CHAPTERS.length;i++){
        var key = chKey(CHAPTERS[i]);
        if(h === key) return {idx:i, sec:null};
        if(h.indexOf(key + '-') === 0) return {idx:i, sec:h.slice(key.length + 1)};
    }
    return null;
}

function openSidebar(){
    if(sidebar.classList.contains('open')) return;
    sidebar.classList.add('open'); backdrop.classList.add('show');
    pushHash(location.hash, {menu:1});          // history entry so Back closes the menu
}
function closeSidebarUI(){ sidebar.classList.remove('open'); backdrop.classList.remove('show'); }
function closeSidebar(){
    if(!sidebar.classList.contains('open')) return;
    closeSidebarUI();
    if(history.state && history.state.menu){ replaceHash(location.hash, {t:'c'}); }  // drop the menu marker
}

var current = 0;
var chapterEls = [];

(function build(){
    var lastGroup = null, lastTrack = null;
    CHAPTERS.forEach(function(ch, idx){
        if(ch.track && ch.track !== lastTrack){
            var tl = document.createElement('div');
            tl.className = 'track-label';
            tl.textContent = ch.track;
            nav.appendChild(tl);
            lastTrack = ch.track;
            lastGroup = null;   // force the group label to re-render under the new track
        }
        if(ch.group !== lastGroup){
            var gl = document.createElement('div');
            gl.className = 'group-label';
            gl.textContent = ch.group;
            nav.appendChild(gl);
            lastGroup = ch.group;
        }
        var wrap = document.createElement('div');
        wrap.className = 'chapter';

        var row = document.createElement('div');
        row.className = 'chapter-row';
        row.innerHTML = '<span class="arrow">▶</span><span class="num">' + ch.num + '</span><span class="title"></span>' +
                        (ch.readMins ? '<span class="read-time">' + ch.readMins + ' min</span>' : '');
        row.querySelector('.title').textContent = ch.title;
        row.addEventListener('click', function(e){
            if(e.target.classList.contains('arrow')){ wrap.classList.toggle('open'); e.stopPropagation(); return; }
            showChapter(idx, null, true);
        });
        prefetchOnInteract(row, ch);

        var secs = document.createElement('div');
        secs.className = 'sections';
        if(ch.sections.length === 0){
            var ns = document.createElement('div'); ns.className='no-sec'; ns.textContent='No sub-sections'; secs.appendChild(ns);
        } else {
            ch.sections.forEach(function(s){
                var a = document.createElement('a');
                // only the boilerplate "TOP ... QUESTIONS" overview entry gets bolded -- not
                // just whichever section happens to be first (some chapters number every
                // section 1, 2, 3... uniformly, where #1 isn't an overview at all).
                var isHighlight = /^TOP\b/i.test(s.text);
                // "SECTION 3 - FOO" or "3. FOO" -> a small numbered badge + a clean title,
                // instead of one long uppercase line.
                var m = /^SECTION\s+(\d+)\s*[-–—:]\s*(.+)$/i.exec(s.text) || /^(\d+)\.\s+(.+)$/.exec(s.text);
                // headings with neither a number nor the TOP-overview treatment (e.g. "PART 1
                // COMPLETE", "SENIOR ENGINEER RAPID FIRE") are dividers, not list entries --
                // style them like a heading instead of an unnumbered orphan link.
                var isDivider = !m && !isHighlight;
                a.className = 'sec-link' + (isHighlight ? ' sec-highlight' : '') + (isDivider ? ' sec-divider' : '');
                a.dataset.sec = s.id;
                if(m){
                    var badge = document.createElement('span');
                    badge.className = 'sec-num';
                    badge.textContent = m[1];
                    a.appendChild(badge);
                }
                var titleSpan = document.createElement('span');
                titleSpan.className = 'sec-title';
                titleSpan.textContent = m ? m[2] : s.text;
                a.appendChild(titleSpan);
                a.addEventListener('click', function(e){ e.preventDefault(); showChapter(idx, s.id, false); });
                secs.appendChild(a);
            });
        }
        wrap.appendChild(row); wrap.appendChild(secs); nav.appendChild(wrap);
        chapterEls.push({wrap:wrap, row:row, secs:secs});
    });
})();

// ---------- Chapter content is fetched on demand, not inlined at build time ----------
var chapterLoads = {};   // chKey(ch) -> in-flight/settled Promise<article>, so a chapter is fetched at most once per page load

function ensureChapterLoaded(ch){
    var key = chKey(ch);
    var existing = document.getElementById('chap-' + key);
    if(existing) return Promise.resolve(existing);
    if(chapterLoads[key]) return chapterLoads[key];
    var p = fetch(ch.file).then(function(res){
        if(!res.ok) throw new Error('HTTP ' + res.status);
        return res.text();
    }).then(function(raw){
        var m = /<body[^>]*>([\s\S]*)<\/body>/i.exec(raw);
        var inner = m ? m[1] : raw;
        // namespace heading ids the same way the build script does: id="h12" -> id="cjava-05-h12"
        inner = inner.replace(/id="(h\d+)"/g, 'id="c' + key + '-$1"');
        var article = document.createElement('article');
        article.className = 'chapter-content';
        article.id = 'chap-' + key;
        article.innerHTML = inner;
        content.appendChild(article);
        return article;
    }).catch(function(err){
        delete chapterLoads[key];   // don't permanently cache a failure -- let a retry try again
        throw err;
    });
    chapterLoads[key] = p;
    return p;
}

// prefetch on hover/focus so a click usually finds the chapter already loaded
function prefetchOnInteract(el, ch){
    var done = false;
    var go = function(){ if(!done){ done = true; ensureChapterLoaded(ch).catch(function(){}); } };
    el.addEventListener('mouseenter', go);
    el.addEventListener('focus', go);
}

var loadToken = 0;   // guards against a slower, superseded fetch clobbering a newer navigation

function applyChapter(idx, sectionId, collapseOthers){
    current = idx;
    var ch = CHAPTERS[idx];
    var myToken = ++loadToken;

    document.querySelectorAll('.chapter-content.active').forEach(function(a){ a.classList.remove('active'); });

    chapterEls.forEach(function(el, i){
        var on = (i === idx);
        el.row.classList.toggle('active', on);
        if(on) el.wrap.classList.add('open');
        else if(collapseOthers) el.wrap.classList.remove('open');
        el.secs.querySelectorAll('.sec-link.active').forEach(function(a){a.classList.remove('active');});
    });

    topTitle.textContent = ch.num + ' · ' + ch.title + (ch.readMins ? ' · ' + ch.readMins + ' min' : '');
    prevBtn.disabled = (idx === 0);
    nextBtn.disabled = (idx === CHAPTERS.length - 1);

    var alreadyLoaded = !!document.getElementById('chap-' + chKey(ch));
    if(!alreadyLoaded){ loadingIndicator.classList.add('show'); }

    return ensureChapterLoaded(ch).then(function(article){
        if(myToken !== loadToken) return null;   // a newer navigation has since taken over
        loadingIndicator.classList.remove('show');
        article.classList.add('active');
        content.scrollTop = 0;
        if(sectionId){
            var target = document.getElementById('c' + chKey(ch) + '-' + sectionId);
            if(target){ target.scrollIntoView({block:'start'}); }
            var link = chapterEls[idx].secs.querySelector('[data-sec="'+sectionId+'"]');
            if(link){ link.classList.add('active'); link.scrollIntoView({block:'nearest'}); }
        }
        return article;
    }).catch(function(err){
        // fully handled here (error shown, retry wired up) -> resolve, not reject, so no
        // caller of applyChapter/showChapter needs its own .catch to avoid a console warning
        if(myToken !== loadToken) return null;
        loadingIndicator.classList.remove('show');
        var errBox = document.createElement('div');
        errBox.className = 'chapter-content active load-error';
        errBox.innerHTML = 'Could not load this chapter (' + ch.file + '). Check your connection and <a>try again</a>.';
        errBox.querySelector('a').addEventListener('click', function(){ errBox.remove(); applyChapter(idx, sectionId, collapseOthers); });
        content.appendChild(errBox);
        return null;
    });
}

// user-initiated navigation -> records a history entry so the Back button works
function showChapter(idx, sectionId, collapseOthers){
    var p = applyChapter(idx, sectionId, collapseOthers);
    var hash = makeHash(idx, sectionId);
    if(history.state && history.state.menu){ replaceHash(hash, {t:'c'}); }   // replace the menu marker
    else if(location.hash !== hash){ pushHash(hash, {t:'c'}); }
    else { replaceHash(hash, {t:'c'}); }
    if(window.innerWidth <= 820){ closeSidebarUI(); }
    return p;
}

prevBtn.addEventListener('click', function(){ if(current>0) showChapter(current-1, null, true); });
nextBtn.addEventListener('click', function(){ if(current<CHAPTERS.length-1) showChapter(current+1, null, true); });

document.getElementById('hamburger').addEventListener('click', function(){
    if(sidebar.classList.contains('open')) closeSidebar(); else openSidebar();
});
backdrop.addEventListener('click', closeSidebar);

document.getElementById('filter').addEventListener('input', function(){
    var q = this.value.trim().toLowerCase();
    chapterEls.forEach(function(el, i){
        var ch = CHAPTERS[i];
        var inTitle = (ch.num + ' ' + ch.title).toLowerCase().indexOf(q) !== -1;
        var matchSecs = 0;
        el.secs.querySelectorAll('.sec-link').forEach(function(a){
            var hit = a.textContent.toLowerCase().indexOf(q) !== -1;
            a.style.display = (q === '' || inTitle || hit) ? 'block' : 'none';
            if(hit) matchSecs++;
        });
        var show = (q === '' || inTitle || matchSecs > 0);
        el.wrap.style.display = show ? '' : 'none';
        if(q !== '' && matchSecs > 0 && !inTitle){ el.wrap.classList.add('open'); }
    });
    document.querySelectorAll('.group-label').forEach(function(gl){
        var n = gl.nextElementSibling, anyVisible = false;
        while(n && n.classList.contains('chapter')){ if(n.style.display !== 'none'){ anyVisible = true; break; } n = n.nextElementSibling; }
        gl.style.display = anyVisible ? '' : 'none';
    });
    document.querySelectorAll('.track-label').forEach(function(tl){
        var n = tl.nextElementSibling, anyVisible = false;
        while(n && !n.classList.contains('track-label')){
            if(n.classList.contains('group-label') && n.style.display !== 'none'){ anyVisible = true; break; }
            n = n.nextElementSibling;
        }
        tl.style.display = anyVisible ? '' : 'none';
    });
});

// Back/Forward button: close the menu if open, else step to the previous chapter/section
window.addEventListener('popstate', function(){
    if(sidebar.classList.contains('open')){ closeSidebarUI(); return; }
    var p = parseHash();
    if(p){ applyChapter(p.idx, p.sec, true); }
});

// ---------- Resume last read position ----------
// Single fixed key: the reader is reachable at both '/' and '/handbook.html'
// (see vercel.json), and progress should carry over regardless of entry URL.
var PROGRESS_KEY = 'handbook-progress';
var PROGRESS_MAX_AGE_MS = 90 * 24 * 60 * 60 * 1000; // 90 days
function saveProgress(){
    try{ localStorage.setItem(PROGRESS_KEY, JSON.stringify({hash:location.hash, scroll:content.scrollTop, ts:Date.now()})); }catch(e){}
}
var saveProgressTimer = null;
function saveProgressSoon(){ clearTimeout(saveProgressTimer); saveProgressTimer = setTimeout(saveProgress, 400); }
content.addEventListener('scroll', saveProgressSoon);
window.addEventListener('beforeunload', saveProgress);
document.addEventListener('visibilitychange', function(){ if(document.visibilityState === 'hidden') saveProgress(); });
function loadProgress(){
    try{
        var p = JSON.parse(localStorage.getItem(PROGRESS_KEY));
        if(!p || !p.hash) return null;
        if(!p.ts || (Date.now() - p.ts) > PROGRESS_MAX_AGE_MS) return null;
        return p;
    }catch(e){ return null; }
}

var rawHash = location.hash;
var init = parseHash();
var saved = loadProgress();
var resumed = null;
if(!init){
    // no hash at all (fresh tab / bookmark to the bare URL) -> resume the saved chapter
    if(saved){ location.hash = saved.hash; init = parseHash(); if(init) resumed = saved; }
} else if(saved && saved.hash === rawHash){
    // plain page refresh: URL already has the hash we were last on -> also restore the exact scroll offset
    resumed = saved;
}
if(init){
    var initLoad = applyChapter(init.idx, init.sec, true);
    replaceHash(makeHash(init.idx, init.sec), {t:'c'});
    // wait for the (async, fetched) chapter to actually be in the DOM before forcing
    // the exact scroll offset -- otherwise this races the fetch and gets overwritten
    if(resumed && resumed.scroll){ initLoad.then(function(){ requestAnimationFrame(function(){ content.scrollTop = resumed.scroll; }); }); }
} else {
    applyChapter(0, null, true); replaceHash(makeHash(0, null), {t:'c'});
}
</script>
</body>
