name: Build check

# Regenerates handbook.html (and any other _build_index.py output) from the
# source chapter files and templates, then fails if that produces a diff.
# Catches the "edited a chapter file but forgot to run
# `python _build_index.py` before committing" mistake before it reaches main.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  rebuild-and-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Rebuild handbook from source chapters
        run: python _build_index.py

      - name: Fail if the rebuild produced a diff
        run: |
          if ! git diff --exit-code; then
            echo ""
            echo "::error::handbook.html/index.html are stale — they don't match what"
            echo "'python _build_index.py' produces from the current source chapter"
            echo "files and templates. Run it locally and commit the result."
            exit 1
          fi
